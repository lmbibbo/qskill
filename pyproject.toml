[project]
name = "qskill"
version = "0.1.0"
description = "Agent skills for programming quantum projects across Qiskit, PennyLane and Cirq"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
qiskit = [
  "qiskit>=2.4,<2.5",
  "qiskit-aer>=0.17",
]
pennylane = [
  "pennylane>=0.40",
]
cirq = [
  "cirq>=1.4",
]
dev = [
  "pyyaml>=6.0,<7",
]

[tool.uv]
package = false
